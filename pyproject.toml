[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "3wa-plate-ai"
version = "0.1.0.dev0"
description = "Taiwan license plate synthetic data, training, and high-speed reading tools"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "numpy>=2.4.2,<2.5",
  "opencv-python-headless>=5.0.0.93,<5.1",
  "Pillow>=12.3.0,<13",
  "jsonschema>=4.26.0,<5",
]

[project.scripts]
plateai-generate = "plateai_trainer.synthetic.cli:main"
plateai-train = "plateai_trainer.training.cli:main"
plateai-export = "plateai_trainer.export.cli:main"
plateai-compose = "plateai_trainer.detection.cli:main"
plateai-detect-train = "plateai_trainer.detection.train_cli:main"
plateai-detect-export = "plateai_trainer.detection.export_cli:main"
plateai-read = "plateai_reader.cli:main"
plateai-eval = "plateai_eval.cli:main"
plateai-web = "plateai_web.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=9.1.1,<10",
  "hypothesis>=6.168.0,<7",
  "build>=1.2,<2",
]
training = [
  "torch==2.14.0",
  "onnx==1.23.0",
  "onnxruntime==1.30.0",
  "onnxscript==0.7.2",
]
reader = [
  "onnx==1.23.0",
  "onnxruntime==1.30.0",
]
web = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/3wa-plate-ai/configs/charsets" = ["configs/charsets/*.txt"]
"share/3wa-plate-ai/configs/plate_rules" = ["configs/plate_rules/*.json"]
"share/3wa-plate-ai/configs/plate_templates" = ["configs/plate_templates/*.json"]
"share/3wa-plate-ai/configs/augmentation" = ["configs/augmentation/*.json"]
"share/3wa-plate-ai/configs/detection" = ["configs/detection/*.json"]
"share/3wa-plate-ai/configs/evaluation" = ["configs/evaluation/*.json"]
"share/3wa-plate-ai/configs/publication" = ["configs/publication/*.json"]
"share/3wa-plate-ai/schemas" = ["schemas/*.json"]
"share/3wa-plate-ai/fonts" = ["assets/fonts/NotoSansMono*.ttf", "assets/fonts/OFL.txt"]
"share/3wa-plate-ai/web" = ["web/*.html"]
"share/3wa-plate-ai/web/css" = ["web/css/*.css"]
"share/3wa-plate-ai/web/js" = ["web/js/*.js"]
"share/3wa-plate-ai/web/assets" = ["web/assets/*.jpg", "web/assets/*.png"]
"share/3wa-plate-ai/annotations" = ["annotations/*.json", "annotations/README.md"]
"share/3wa-plate-ai/docs" = ["docs/pose-training.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
