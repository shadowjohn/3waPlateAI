name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/py311.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m plateai_trainer.synthetic generate --count 3 --seed 42 --output "$RUNNER_TEMP/plateai-smoke"
